<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Exam System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F393;</text></svg>">
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        body {
            background: linear-gradient(135deg, #312e81 0%, #4338ca 50%, #3730a3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--color-surface);
            padding: 48px 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 420px;
            width: 100%;
        }

        .lock-icon {
            width: 56px;
            height: 56px;
            background: var(--color-primary-bg);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .lock-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--color-primary);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            color: var(--color-text);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--color-text-muted);
            font-size: 0.9375rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.9375rem;
            color: var(--color-text);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: var(--color-primary-hover);
            box-shadow: var(--shadow-md);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: var(--color-danger-bg);
            color: #991b1b;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            border-left: 4px solid var(--color-danger);
            font-size: 0.9375rem;
        }

        .security-note {
            background: var(--color-info-bg);
            color: #075985;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border-left: 4px solid var(--color-info);
            font-size: 0.875rem;
        }

        .back-link {
            display: block;
            text-align: center;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 10px;
            border-radius: var(--radius-md);
            transition: background var(--transition-fast);
        }

        .back-link:hover {
            background: var(--color-primary-bg);
        }

        .input-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 0.875rem;
        }

        .toggle-password:hover {
            color: var(--color-primary);
        }

        .demo-hint {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border);
            text-align: center;
        }

        .demo-hint p {
            color: var(--color-text-muted);
            font-size: 0.8125rem;
        }

        .demo-hint code {
            background: var(--color-bg-subtle);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 32px 24px;
                margin: 10px;
            }

            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>

        <div class="header">
            <h1>Admin Access</h1>
            <p>Enter the secret key to continue</p>
        </div>

        {% if error %}
        <div class="error">
            <strong>Access Denied:</strong> {{ error }}
        </div>
        {% endif %}

        <div class="security-note">
            <strong>Security Notice:</strong>
            This area is restricted to authorized administrators only.
        </div>

        <form method="POST" action="/admin/login" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="secret_key">Secret Key</label>
                <div class="input-container">
                    <input
                        type="password"
                        id="secret_key"
                        name="secret_key"
                        required
                        placeholder="Enter admin secret key"
                        autocomplete="off"
                        maxlength="50"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                Sign In
            </button>
        </form>

        <a href="/" class="back-link">
            &larr; Back to Home
        </a>

        <div class="demo-hint">
            <p><strong>Demo key:</strong> <code>exam_admin_2025</code></p>
            <p style="margin-top: 6px; font-size: 0.75rem; color: var(--color-text-muted);">Remove this hint in production</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('secret_key');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
            } else {
                passwordField.type = 'password';
                eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        document.getElementById('secret_key').focus();

        document.getElementById('loginForm').addEventListener('submit', function() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Verifying...';
            submitBtn.disabled = true;
        });

        {% if error %}
        document.getElementById('secret_key').value = '';
        document.getElementById('secret_key').focus();

        const container = document.querySelector('.login-container');
        container.style.animation = 'shake 0.4s ease-in-out';
        const style = document.createElement('style');
        style.textContent = '@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }';
        document.head.appendChild(style);
        {% endif %}
    </script>
</body>
</html>
